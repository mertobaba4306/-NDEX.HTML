50%{

SLOT
=========================== */

.slot{

margin-bottom:25px;

inset 0 0 15px rgba(255,150,0,.15),

.shine{

top:-100%;

height:350%;

120deg,

translateX(120%)

drop-shadow(0 0 25px rgba(255,180,0,.45));

100%{

/* ==========================================
   HTML ELEMENTLERİ
========================================== */

const burgerName=document.getElementById("burgerName");

const burgerImage=document.getElementById("burgerImage");

const burgerTitle=document.getElementById("title");

const burgerDesc=document.getElementById("description");

const spinButton=document.getElementById("spinButton");

const ding=document.getElementById("ding");

const card=document.querySelector(".card");

const canvas=document.getElementById("confetti");

const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;

canvas.height=window.innerHeight;

let spinning=false;

let winner=null;
/* ==========================================
   SLOT MACHINE ENGINE
========================================== */

function randomBurger(){

return burgers[Math.floor(Math.random()*burgers.length)];

}

function createStars(count){

let html="";

for(let i=0;i<count;i++){

html+="⭐";

}

return html;

}

function showBurger(item){

burgerName.innerHTML="🍔 "+item.name;

burgerTitle.innerHTML=item.name;

burgerDesc.innerHTML=

item.description+

"<br><br>"+

createStars(item.stars);

burgerImage.src=item.image;

burgerImage.classList.remove("show");

setTimeout(()=>{

burgerImage.classList.add("show");

},80);

}

function startSlot(){

if(spinning) return;

spinning=true;

spinButton.disabled=true;

spinButton.innerHTML="🎰 ÇEVRİLİYOR...";

card.classList.remove("active");

burgerImage.classList.remove("show");

let counter=0;

const interval=setInterval(()=>{

const current=randomBurger();

burgerName.innerHTML="🍔 "+current.name;

counter++;

if(navigator.vibrate){

navigator.vibrate(15);

}

if(counter>=30){

clearInterval(interval);

winner=randomBurger();

showBurger(winner);

card.classList.add("active");

playDing();

launchConfetti();

flashCard();

imageGlow();

shakeScreen();

goldGlow();

burgerPop();

titleFlash();

flashBackground();

spinButton.disabled=false;

spinButton.innerHTML="🎲 HANGİ TOTO'YUM?";

spinning=false;

}

},90);

}


/* ==========================================
   DING SOUND
========================================== */

function playDing(){

if(!ding) return;

ding.currentTime=0;

ding.play().catch(()=>{});

}


/* ==========================================
   IMAGE EFFECT
========================================== */

function imageGlow(){

burgerImage.style.filter=

"drop-shadow(0 0 25px orange) drop-shadow(0 0 55px gold)";

setTimeout(()=>{

burgerImage.style.filter=

"drop-shadow(0 0 20px rgba(255,180,0,.45))";

},2000);

}


/* ==========================================
   CARD EFFECT
========================================== */

function flashCard(){

card.classList.add("glow");

setTimeout(()=>{

card.classList.remove("glow");

},1800);

}


/* ==========================================
   SHAKE EFFECT
========================================== */

function shakeScreen(){

document.body.animate(

[

{transform:"translateX(0px)"},

{transform:"translateX(-8px)"},

{transform:"translateX(8px)"},

{transform:"translateX(-6px)"},

{transform:"translateX(6px)"},

{transform:"translateX(0px)"}

],

{

duration:350

}

);

}/* ==========================================
   BURGER TOTO
   CONFETTI ENGINE
========================================== */

let particles=[];

class Confetti{

constructor(){

this.x=Math.random()*canvas.width;

this.y=-20;

this.size=Math.random()*12+6;

this.speed=Math.random()*6+3;

this.rotation=Math.random()*360;

this.rotate=Math.random()*8-4;

this.color=[

"#ff9800",

"#ffc107",

"#ffffff",

"#ff5722",

"#ffd54f"

][Math.floor(Math.random()*5)];

}

update(){

this.y+=this.speed;

this.rotation+=this.rotate;

}

draw(){

ctx.save();

ctx.translate(this.x,this.y);

ctx.rotate(this.rotation*Math.PI/180);

ctx.fillStyle=this.color;

ctx.fillRect(

-this.size/2,

-this.size/2,

this.size,

this.size

);

ctx.restore();

}

}

function launchConfetti(){

particles=[];

for(let i=0;i<220;i++){

particles.push(new Confetti());

}

animateConfetti();

}

function animateConfetti(){

ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);

particles.forEach(p=>{

p.update();

p.draw();

});

particles=particles.filter(

p=>p.y<canvas.height+30

);

if(particles.length>0){

requestAnimationFrame(

animateConfetti

);

}

}


/* ==========================================
   GOLD GLOW EFFECT
========================================== */

function goldGlow(){

card.style.boxShadow=

"0 0 30px orange,0 0 60px gold,0 0 100px #ff9800";
